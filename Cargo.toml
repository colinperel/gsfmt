[package]
name = "gsfmt"
version = "0.7.1"
edition = "2021"
rust-version = "1.74"
description = "Formatter for Google Sheets formulas (LET/LAMBDA aware)"
license = "MIT"
repository = "https://github.com/colinperel/gsfmt"
readme = "README.md"
keywords = ["google-sheets", "formatter", "formula", "spreadsheet"]
categories = ["command-line-utilities", "text-processing"]
# Planning documents are historical artifacts and .github is CI plumbing;
# neither belongs in the published crate.
exclude = ["/.github", "/*-PLAN.md", "/PLAN.md"]

[dependencies]

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# The formatter indexes parallel Vecs (args/seps, keys/pairs) where the index
# carries meaning; rewriting these as iterator zips reads worse.
needless_range_loop = "allow"

[profile.release]
opt-level = 2
strip = true
